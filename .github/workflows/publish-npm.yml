name: Publish fork package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested release tag (for example v3.10.2)
        required: true
        type: string
      prerelease:
        description: Publish to the next dist-tag
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      DIST_TAG: ${{ (inputs.prerelease || github.event.release.prerelease) && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Verify release identity and immutable version
        run: |
          node scripts/verify-release-version.mjs
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.name !== "@thanhndv212/opencode-quota") throw new Error("Unexpected npm publishing target");
          '
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - name: Pack and verify the publishable artifact
        run: |
          mkdir -p package-artifacts
          pnpm pack --pack-destination package-artifacts
          TARBALL="$(find package-artifacts -name '*.tgz' -print -quit)"
          node scripts/smoke-package.mjs "$TARBALL"
          xvfb-run -a node scripts/smoke-gui.mjs "$TARBALL"
          sha256sum "$TARBALL" > package-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-package
          path: package-artifacts/*
      - name: Publish verified fork tarball
        run: |
          TARBALL="$(find package-artifacts -name '*.tgz' -print -quit)"
          npm publish "$TARBALL" --access public --provenance --tag "$DIST_TAG"
