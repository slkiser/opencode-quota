name: Thin issue check

on:
  issues:
    types: [opened, edited]

concurrency:
  group: thin-issue-check-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    # Maintainers may open short tracking issues on purpose. Bots (the upstream update check)
    # open issues without a form on purpose.
    if: ${{ github.event.issue.user.type != 'Bot' && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Label thin issues as needs info
        uses: actions/github-script@v9
        with:
          script: |
            const label = "needs info";
            const marker = "<!-- thin-issue-check -->";
            const noFormMarker = "<!-- no-form-issue-check -->";
            // The issue forms add one of these labels when the issue is created.
            const formLabels = ["bug", "feature", "provider"];
            const issue = context.payload.issue;
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            };

            // An issue opened without a form (for example by an AI agent using `gh issue create`)
            // has none of the form labels. Ask for a new issue made with a form, once.
            const fromForm = issue.labels.some((l) => formLabels.includes(l.name));
            if (context.payload.action === "opened" && !fromForm) {
              const comments = await github.paginate(github.rest.issues.listComments, params);
              if (!comments.some((c) => c.body?.includes(noFormMarker))) {
                if (!issue.labels.some((l) => l.name === label)) {
                  await github.rest.issues.addLabels({ ...params, labels: [label] });
                }
                await github.rest.issues.createComment({
                  ...params,
                  body: [
                    noFormMarker,
                    "Thanks for opening this! This issue was not made with one of our forms, so we added the `needs info` label.",
                    "",
                    "Please open a new issue with a form: https://github.com/slkiser/opencode-quota/issues/new/choose. The forms ask for the details we need to help.",
                  ].join("\n"),
                });
              }
              return;
            }

            // Title without a "[bug]:" style prefix.
            const title = issue.title.replace(/^\s*\[[^\]]*\]\s*:?/u, "").trim();
            // Fixed answers of the version dropdown are picked, not typed. GitHub writes
            // each answer as "### <label>", a blank line, then the answer, so they are
            // ignored only on the answer line of their own dropdown, never elsewhere.
            const dropdownAnswers = new Map([
              [
                "### Which OpenCode do you use?",
                ["OpenCode 2", "OpenCode 1"],
              ],
            ]);
            // Body text the reporter typed: drop dropdown answers, form headings, empty-field
            // placeholders, checkbox lines, HTML comments, and whitespace.
            const lines = (issue.body ?? "").replace(/<!--[\s\S]*?-->/gu, "").split("\n");
            const typedBody = lines
              .filter((line, index) => !dropdownAnswers.get(lines[index - 2]?.trim())?.includes(line.trim()))
              .filter((line) => !/^\s*(###\s|_No response_|- \[[ xX]\]\s)/u.test(line))
              .join("")
              .replace(/\s+/gu, "");
            const thin = title.length < 8 || typedBody.length < 40;
            const labeled = issue.labels.some((l) => l.name === label);

            if (thin && !labeled) {
              await github.rest.issues.addLabels({ ...params, labels: [label] });
              await github.rest.issues.createComment({
                ...params,
                body: [
                  marker,
                  "Thanks for opening this! It looks a bit short right now, so we added the `needs info` label.",
                  "",
                  "Please edit the issue to add a clear title and fill in the form fields with the details they ask for. The label comes off automatically once the details are in.",
                  "",
                  "Issues labeled `needs info` close after 21 days without activity.",
                ].join("\n"),
              });
            } else if (!thin && labeled) {
              // Only undo a label this workflow added, never a maintainer's.
              const comments = await github.paginate(github.rest.issues.listComments, params);
              // Never undo the label on an issue that was flagged as not from a form.
              if (
                comments.some((c) => c.body?.includes(marker)) &&
                !comments.some((c) => c.body?.includes(noFormMarker))
              ) {
                await github.rest.issues.removeLabel({ ...params, name: label });
              }
            }

  version-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Label issues for v4 from form answers
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            // GitHub writes each form answer as "### <label>", a blank line, then the answer.
            const lines = (issue.body ?? "").split(/\r?\n/u);
            const answer = (label) => {
              const index = lines.indexOf(`### ${label}`);
              return index === -1 ? undefined : lines[index + 2]?.trim();
            };

            const labels = [];
            if (answer("Which OpenCode do you use?") === "OpenCode 1") {
              labels.push("v4");
            }

            // Only add labels, never remove them.
            const missing = labels.filter((name) => !issue.labels.some((l) => l.name === name));
            if (missing.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: missing,
              });
            }
