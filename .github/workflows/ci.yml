name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Account cache process isolation
        run: pnpm run smoke:account-cache

      - name: Native history migration and rollback compatibility
        run: pnpm run smoke:history:compat

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Bun SQLite history compatibility
        run: bun scripts/smoke-history-compat.mjs

      - name: Pack
        run: |
          mkdir -p package-artifacts
          pnpm pack --pack-destination package-artifacts

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: package-artifacts/*.tgz
          if-no-files-found: error

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: pnpm-quality

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: package-artifacts

      - name: Smoke test installed tarball
        run: |
          TARBALL="$(find "$GITHUB_WORKSPACE/package-artifacts" -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          node scripts/smoke-package.mjs "$TARBALL"

  desktop-smoke:
    runs-on: ${{ matrix.os }}
    needs: pnpm-quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: package-artifacts
      - name: Smoke installed Electron app
        shell: bash
        run: |
          TARBALL="$(find "$GITHUB_WORKSPACE/package-artifacts" -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/smoke-gui.mjs "$TARBALL"
          else
            node scripts/smoke-gui.mjs "$TARBALL"
          fi

  required-gate:
    if: always()
    runs-on: ubuntu-latest
    needs: [pnpm-quality, runtime-smoke, desktop-smoke]
    steps:
      - name: Require every applicable job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = JSON.parse(process.env.RESULTS);
            if (Object.values(jobs).some(job => job.result !== "success")) {
              console.error(jobs);
              process.exit(1);
            }
          '
