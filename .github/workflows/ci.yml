name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pnpm-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      # Installs Vite+ and the pnpm version in package.json `packageManager`, then
      # `vp install --frozen-lockfile` with the pnpm store cached by lockfile hash.
      - name: Install dependencies
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-manager: false
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Run canonical verification
        run: pnpm verify

      - name: Pack and audit exact npm artifact once
        run: pnpm run pack:release-package package-artifacts

      - name: Upload exact npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: package-artifacts/*
          if-no-files-found: error

  windows-verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      # Installs Vite+ and the pnpm version in package.json `packageManager`, then
      # `vp install --frozen-lockfile` with the pnpm store cached by lockfile hash.
      - name: Install dependencies
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-manager: false
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Run canonical verification
        run: pnpm verify

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: pnpm-quality

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download exact npm artifact
        uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: package-artifacts

      - name: Smoke exact npm artifact on Node ${{ matrix.node-version }}
        run: node .github/scripts/smoke-packed-package.mjs package-artifacts

      - name: Install exact npm artifact globally with npm 12 on Node ${{ matrix.node-version }}
        run: node .github/scripts/smoke-packed-global-install.mjs package-artifacts
