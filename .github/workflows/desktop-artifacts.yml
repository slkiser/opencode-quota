name: Desktop candidate artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed commit SHA or existing release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - name: Verify fork candidate identity
        env:
          CANDIDATE_REF: ${{ inputs.ref }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { execFileSync } from "node:child_process";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.name !== "@thanhndv212/opencode-quota" || pkg.repository.url !== "git+https://github.com/thanhndv212/opencode-quota.git") throw new Error("Unexpected fork identity");
            const ref = process.env.CANDIDATE_REF;
            if (/^v[0-9]/.test(ref)) {
              execFileSync(process.execPath, ["scripts/verify-release-version.mjs"], {stdio:"inherit", env:{...process.env, RELEASE_TAG:ref}});
              const head=execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();
              const tag=execFileSync("git",["rev-parse",`refs/tags/${ref}^{commit}`],{encoding:"utf8"}).trim();
              if(head!==tag) throw new Error("Tag/commit mismatch");
            }
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - name: Validate installed desktop runtime
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a pnpm run smoke:gui
          else
            pnpm run smoke:gui
          fi
      - name: Package unsigned candidate
        shell: bash
        run: |
          pnpm run build:icons
          if [ "$RUNNER_OS" = macOS ]; then
            pnpm exec electron-builder --mac --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false
          else
            pnpm exec electron-builder --linux --publish never
          fi
      - name: Install and exercise the actual candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          install_dir=$(mktemp -d)
          if [ "$RUNNER_OS" = macOS ]; then
            mount_dir=$(mktemp -d)
            dmg=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
            trap 'hdiutil detach "$mount_dir" || true; rm -rf "$install_dir" "$mount_dir"' EXIT
            ditto "$mount_dir/OpenCode Quota.app" "$install_dir/OpenCode Quota.app"
            node scripts/smoke-packaged-app.mjs "$install_dir/OpenCode Quota.app/Contents/MacOS/OpenCode Quota" release/installed-smoke
          else
            trap 'rm -rf "$install_dir"' EXIT
            deb=$(find release -maxdepth 1 -name '*.deb' -print -quit)
            dpkg-deb --extract "$deb" "$install_dir"
            binary=$(find "$install_dir/opt" -type f -name opencode-quota -perm -u+x -print -quit)
            test -n "$binary"
            xvfb-run -a node scripts/smoke-packaged-app.mjs "$binary" release/installed-smoke
          fi
      - name: Record candidate provenance and checksums
        env:
          CANDIDATE_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { execFileSync } from "node:child_process";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            fs.writeFileSync("release/CANDIDATE.json", JSON.stringify({
              name: pkg.name, version: pkg.version,
              commit: execFileSync("git", ["rev-parse", "HEAD"], {encoding:"utf8"}).trim(),
              node: process.version, os: process.platform, arch: process.arch,
              signing: "unsigned candidate; signing/notarization/Gatekeeper approval unverified",
              installedArtifactSmoke: "actual DMG/deb payload; six tabs/preload/version; isolated fixtures",
              electron: JSON.parse(fs.readFileSync("node_modules/electron/package.json", "utf8")).version,
              pnpm: execFileSync("pnpm", ["--version"], {encoding:"utf8"}).trim(),
              sourceRef: process.env.CANDIDATE_REF || null
            }, null, 2));
          '
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path("release")
          artifacts = sorted(p for p in root.iterdir() if p.suffix in (".dmg", ".zip", ".AppImage", ".deb"))
          if not artifacts: raise SystemExit("No desktop artifacts generated")
          (root / "SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n" for p in artifacts))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS
            release/CANDIDATE.json
            release/installed-smoke/*
