name: Feature request
description: Propose a new feature or behavior change
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Ideas that change what you see on screen go to [#293](https://github.com/slkiser/opencode-quota/issues/293).

        Something broken? Use **Bug report**.

        New provider? Use **Provider request**.

  - type: dropdown
    id: display_change
    attributes:
      label: Does this change what you see on screen?
      description: For example a new row, color, or layout in the sidebar, pop-ups, or the line under the message box.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: input
    id: opencode_version
    attributes:
      label: Your OpenCode version
      description: Example `2.0.20`
      placeholder: 2.0.20
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Your plugin version
      description: Run `/quota_status` in OpenCode. The version is in the first line. If it has `beta` in it, update first, because it may already work.
      placeholder: 6.0.0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: A sketch or screenshot helps. Drag it into this box.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Other ideas you thought about (optional)
