name: Feature request
description: Propose a new feature or behavior change
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Title: the problem you see, not the fix.

        Describe the change here. Features target OpenCode Quota 6 on OpenCode 2; OpenCode 1 receives requested small fixes.

        Something broken? Use **Bug report**.

        New provider? Use **Provider request**.

  - type: input
    id: what_you_see
    attributes:
      label: In one sentence, what do you see?
      description: What happens on your screen. No function or file names.
    validations:
      required: true

  - type: dropdown
    id: opencode_line
    attributes:
      label: Which OpenCode do you use?
      options:
        - OpenCode 2
        - OpenCode 1
    validations:
      required: true

  - type: input
    id: opencode_version
    attributes:
      label: Your OpenCode version
      description: Example `2.0.20`
      placeholder: 2.0.20
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Your plugin version
      description: Run `/quota_status` in OpenCode. The version is in the first line. If it has `beta` in it, update first, because it may already work.
      placeholder: 6.0.0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: A sketch or screenshot helps. Drag it into this box.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Other ideas you thought about (optional)
